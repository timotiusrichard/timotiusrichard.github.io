<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wealth">
<meta name="theme-color" content="#08080b">
<title>Wealth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#08080b;--bg1:#111116;--bg2:#191920;--bg3:#222229;
  --tx:#f0ede6;--tx2:#8a8a9c;--tx3:#42424e;
  --gold:#c9a870;--goldl:#e0bf8a;--golddim:rgba(201,168,112,.12);
  --ok:#2eb870;--no:#e04f4f;--okdim:rgba(46,184,112,.12);--nodim:rgba(224,79,79,.10);
  --bd:rgba(255,255,255,.06);--bd2:rgba(255,255,255,.12);
  --r:12px;--pill:100px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --font-d:'Syne',-apple-system,sans-serif;--font-m:'DM Mono',ui-monospace,monospace;
}
html,body{height:100%;background:#000;overflow:hidden;margin:0;padding:0}
body{font-family:var(--font-d);-webkit-font-smoothing:antialiased;color:var(--tx)}
button,input,select,textarea{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit;outline:none}
input,select,textarea{cursor:text}

#app{background:var(--bg);width:100%;height:100dvh;max-width:480px;margin:0 auto;
  display:flex;flex-direction:column;overflow:hidden;position:relative}

/* Header */
#hdr{background:rgba(8,8,11,.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:.5px solid var(--bd);padding:var(--sat) 1rem 0;flex-shrink:0;z-index:50}
.hdr-row{height:52px;display:flex;align-items:center;justify-content:space-between}
.wordmark{font-size:14px;font-weight:800;letter-spacing:.06em;color:var(--gold)}
.wordmark .sub{font-size:8px;font-weight:600;letter-spacing:.06em;color:var(--tx3);margin-left:6px;vertical-align:1px}
.hdr-right{display:flex;gap:6px}
.icon-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--bg2);border:.5px solid var(--bd2);color:var(--gold);transition:opacity .12s}
.icon-btn.ghost{background:transparent;border-color:transparent;color:var(--tx2)}
.icon-btn:active{opacity:.55}
.icon-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.spinning svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Nav */
nav{background:rgba(8,8,11,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:.5px solid var(--bd);display:flex;flex-shrink:0;padding-bottom:var(--sab);z-index:50}
.nbt{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--tx3);font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;transition:color .15s}
.nbt svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nbt.on{color:var(--gold)}

/* Main scroll */
#main{flex:1;overflow:hidden;position:relative;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.on{display:block}

/* Common */
.sec-hdr{padding:7px 1rem;background:var(--bg1);font-size:8.5px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;color:var(--tx2);display:flex;justify-content:space-between}
.sec-hdr-r{font-family:var(--font-m);font-size:8.5px;color:var(--tx3);letter-spacing:-.1px}
.tab-hd{padding:1.1rem 1rem .8rem;border-bottom:.5px solid var(--bd)}
.tab-hd .ttl{font-size:18px;font-weight:800;letter-spacing:-.4px}
.tab-hd .sub{font-size:11.5px;color:var(--tx2);margin-top:4px}
.eyebrow{font-size:8.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3)}
.pill{font-family:var(--font-m);font-size:10px;font-weight:500;padding:3px 9px;border-radius:100px;
  white-space:nowrap;line-height:1.4;letter-spacing:-.2px}
.pill.pos{background:var(--okdim);color:var(--ok)}
.pill.neg{background:var(--nodim);color:var(--no)}
.pill.neu{background:var(--bg3);color:var(--tx2)}
.chips-row{display:flex;gap:5px;overflow-x:auto;padding:.65rem 1rem;border-bottom:.5px solid var(--bd);scrollbar-width:none}
.chips-row::-webkit-scrollbar{display:none}
.chip{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:5px 13px;
  border-radius:100px;border:.5px solid var(--bd2);color:var(--tx3);white-space:nowrap;transition:all .15s;line-height:1.4}
.chip.on{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.sort-strip{display:flex;align-items:center;gap:5px;padding:.5rem 1rem;border-bottom:.5px solid var(--bd)}
.sort-strip>span{font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin-right:4px}
.srt{font-size:8.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:4px 11px;
  border-radius:100px;border:.5px solid var(--bd2);color:var(--tx3);transition:all .15s}
.srt.on{background:var(--tx3);color:var(--bg)}
.empty{padding:3rem 1rem;text-align:center;color:var(--tx3);font-size:12px;line-height:2}

/* Hero */
.hero{padding:1.3rem 1rem 1rem;border-bottom:.5px solid var(--bd)}
.nw-big{font-family:var(--font-m);font-size:46px;font-weight:500;letter-spacing:-3px;line-height:1;margin:8px 0 7px}
.hero-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px}
.hero-sub{font-size:11.5px;color:var(--tx2)}
.hero-sub strong{color:var(--tx);font-weight:700}

/* Stats */
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:.5px solid var(--bd)}
.stat{padding:12px 1rem;border-right:.5px solid var(--bd)}
.stat:last-child{border-right:none}
.stat-l{font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin-bottom:5px}
.stat-v{font-family:var(--font-m);font-size:14px;font-weight:500;letter-spacing:-.3px;white-space:nowrap}

/* Flow section */
.flow-sec{padding:1rem;border-bottom:.5px solid var(--bd)}
.flow-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.flow-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--bd);border-radius:11px;overflow:hidden;margin-bottom:10px}
.flow-cell{background:var(--bg1);padding:9px 11px}
.flow-cell .l{font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin-bottom:4px}
.flow-cell .v{font-family:var(--font-m);font-size:13px;font-weight:500;letter-spacing:-.3px}
.flow-cell .v.pos{color:var(--ok)}.flow-cell .v.neg{color:var(--no)}
.flow-bar-row{display:flex;align-items:center;gap:8px}
.flow-bar-lbl{font-size:8.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);white-space:nowrap}
.flow-track{flex:1;height:4px;background:var(--bg3);border-radius:100px;overflow:hidden}
.flow-fill{height:100%;background:linear-gradient(90deg,var(--ok),#5ed49b);border-radius:100px;transition:width .6s}
.flow-rate{font-family:var(--font-m);font-size:10px;color:var(--ok);white-space:nowrap}

/* Goal */
.goal-bar{padding:1rem;border-bottom:.5px solid var(--bd)}
.goal-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.goal-lbl{font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
.goal-val{font-family:var(--font-m);font-size:10px;color:var(--tx2);letter-spacing:-.1px}
.goal-val strong{color:var(--tx);font-weight:500}
.goal-track{height:5px;background:var(--bg3);border-radius:100px;overflow:hidden}
.goal-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--gold),var(--goldl));transition:width .8s}
.goal-proj{font-family:var(--font-m);font-size:9.5px;color:var(--tx3);margin-top:6px;letter-spacing:-.1px}
.goal-proj strong{color:var(--gold)}

/* Allocation */
.alloc-sec{padding:1rem;border-bottom:.5px solid var(--bd)}
.alloc-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.alloc-toggle{display:flex;gap:3px;background:var(--bg2);border:.5px solid var(--bd);border-radius:100px;padding:2px}
.alloc-toggle button{font-size:8px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 9px;border-radius:100px;color:var(--tx3);transition:all .15s}
.alloc-toggle button.on{background:var(--tx3);color:var(--bg)}
.alloc-bar{height:6px;border-radius:100px;overflow:hidden;display:flex;gap:1px;background:var(--bg3);margin-bottom:12px}
.alloc-seg{height:100%}
.alloc-rows{display:flex;flex-direction:column;gap:7px}
.ar{display:flex;align-items:center;gap:8px}
.ar-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.ar-name{flex:1;font-size:11.5px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar-amt{font-family:var(--font-m);font-size:11px;font-weight:500;color:var(--tx);letter-spacing:-.2px}
.ar-pct{font-family:var(--font-m);font-size:11px;color:var(--tx3);width:32px;text-align:right}

/* FX row */
.fx-row{padding:.8rem 1rem;display:flex;gap:14px;font-family:var(--font-m);font-size:10px;
  color:var(--tx3);border-bottom:.5px solid var(--bd);overflow-x:auto;scrollbar-width:none}
.fx-row::-webkit-scrollbar{display:none}
.fx-row .fx{display:inline-flex;gap:5px;align-items:baseline;white-space:nowrap}
.fx-row .fx strong{color:var(--tx2);font-weight:500}
.fx-row .fx span{color:var(--tx)}

/* Holdings rows */
.hrow{display:flex;align-items:center;gap:10px;padding:12px 1rem;border-bottom:.5px solid var(--bd);
  background:var(--bg);position:relative;overflow:hidden;transition:background .08s}
.hrow:active{background:var(--bg2)}
.hrow-bar{position:absolute;left:0;top:0;bottom:0;width:3px}
.hrow-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-family:var(--font-m);font-size:9px;font-weight:500}
.hrow-mid{flex:1;min-width:0}
.hrow-name{font-family:var(--font-m);font-size:13.5px;font-weight:500;letter-spacing:-.3px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow-sub{font-size:10px;color:var(--tx3);margin-top:3px}
.hrow-px{font-family:var(--font-m);font-size:9px;color:var(--tx3);margin-top:2px;letter-spacing:-.1px}
.hrow-right{text-align:right;flex-shrink:0;padding-left:6px}
.hrow-val{font-family:var(--font-m);font-size:13px;font-weight:500;color:var(--tx);letter-spacing:-.3px}
.hrow-pnl{font-family:var(--font-m);font-size:10px;font-weight:500;margin-top:3px}
.hrow-chev svg{width:12px;height:12px;stroke:var(--tx3);fill:none;stroke-width:2;stroke-linecap:round;margin-left:4px}
.live-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ok);margin-left:4px;
  vertical-align:1px;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.stale-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--tx3);margin-left:4px;vertical-align:1px}

/* Add form */
.add-pad{padding:1rem;display:flex;flex-direction:column;gap:13px}
.mode-wrap{background:var(--bg1);border:.5px solid var(--bd);border-radius:12px;padding:3px;display:flex;gap:3px}
.mode-btn{flex:1;padding:9px 0;border-radius:9px;font-size:10px;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;color:var(--tx3);transition:all .18s;display:flex;align-items:center;justify-content:center;gap:5px}
.mode-btn.on.trade{background:var(--bg3);color:var(--tx)}
.mode-btn.on.cashflow{background:var(--golddim);color:var(--gold)}
.type-row{display:flex;gap:6px}
.type-btn{flex:1;padding:9px 0;border-radius:10px;font-size:9px;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;border:.5px solid var(--bd2);color:var(--tx3);transition:all .15s;text-align:center}
.type-btn.on.BUY{background:var(--okdim);color:var(--ok);border-color:rgba(46,184,112,.3)}
.type-btn.on.SELL{background:var(--nodim);color:var(--no);border-color:rgba(224,79,79,.2)}
.type-btn.on.SYNC,.type-btn.on.DIVIDEND{background:var(--bg3);color:var(--tx)}
.type-btn.on.INCOME{background:var(--okdim);color:var(--ok);border-color:rgba(46,184,112,.3)}
.type-btn.on.EXPENSE{background:var(--nodim);color:var(--no);border-color:rgba(224,79,79,.2)}
.field{display:flex;flex-direction:column;gap:5px}
.field-row{display:flex;gap:8px}
.field label{font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
.field input,.field select{background:var(--bg2);border:.5px solid var(--bd2);border-radius:var(--r);
  padding:10px 12px;font-family:var(--font-m);font-size:13px;letter-spacing:-.2px;
  transition:border-color .15s,box-shadow .15s;width:100%;color:var(--tx)}
.field input:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--golddim)}
.field input::placeholder{color:var(--tx3)}
.field select option{background:var(--bg2)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;
  background:var(--bg2);border:.5px solid var(--bd2);border-radius:var(--r);cursor:pointer}
.toggle-lbl{font-size:12px;color:var(--tx2);font-weight:600}
.toggle-lbl small{font-size:10px;color:var(--tx3);display:block;margin-top:1px;font-family:var(--font-m)}
.toggle{width:40px;height:22px;background:var(--bg3);border-radius:100px;position:relative;transition:background .15s;flex-shrink:0}
.toggle.on{background:var(--ok)}
.toggle-knob{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--tx);top:2px;left:2px;transition:left .15s;pointer-events:none}
.toggle.on .toggle-knob{left:20px}
.preview-card{background:var(--bg1);border:.5px solid var(--bd);border-radius:11px;padding:11px 13px}
.gold-btn{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;background:var(--gold);
  color:var(--bg);padding:13px 18px;border-radius:var(--r);flex:1;transition:opacity .12s}
.gold-btn:active{opacity:.7}
.gold-btn:disabled{opacity:.4;cursor:default}
.outline-btn{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;background:var(--bg1);
  color:var(--tx);border:.5px solid var(--bd2);border-radius:var(--r);padding:13px 16px}
.outline-btn:active{opacity:.65}
.add-cta-row{display:flex;gap:8px}
.success-pill{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ok);
  background:var(--okdim);border:.5px solid rgba(46,184,112,.25);border-radius:100px;
  padding:7px 14px;display:inline-flex;align-items:center;gap:6px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* Ledger */
.tx-row{padding:12px 1rem;display:flex;align-items:center;gap:9px;border-bottom:.5px solid var(--bd)}
.tx-tag{min-width:42px;font-family:var(--font-m);font-size:8.5px;font-weight:500;letter-spacing:.05em;
  padding:4px 5px;border-radius:6px;text-align:center;flex-shrink:0}
.tx-tag.BUY{background:var(--okdim);color:var(--ok)}
.tx-tag.SELL{background:var(--nodim);color:var(--no)}
.tx-tag.SYNC,.tx-tag.DIVIDEND{background:var(--bg3);color:var(--tx2)}
.tx-tag.INCOME,.tx-tag.IN{background:var(--okdim);color:var(--ok)}
.tx-tag.EXPENSE,.tx-tag.OUT{background:var(--nodim);color:var(--no)}
.tx-mid{flex:1;min-width:0}
.tx-sym{font-family:var(--font-m);font-size:13px;font-weight:500;color:var(--tx);letter-spacing:-.3px}
.tx-sub{font-size:10px;color:var(--tx3);margin-top:2px}
.tx-right{text-align:right;flex-shrink:0}
.tx-amt{font-family:var(--font-m);font-size:12px;font-weight:500;letter-spacing:-.2px}
.tx-amt.pos{color:var(--ok)}.tx-amt.neg{color:var(--no)}.tx-amt.neu{color:var(--tx)}
.tx-date{font-family:var(--font-m);font-size:9.5px;color:var(--tx3);margin-top:2px}

/* Notes analytics */
.notes-pad{padding:1rem;display:flex;flex-direction:column;gap:12px}
.analytics-card{background:var(--bg1);border:.5px solid var(--bd);border-radius:12px;overflow:hidden}
.analytics-card .card-hd{padding:10px 12px;font-size:8.5px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--gold);border-bottom:.5px solid var(--bd)}
.analytics-card .card-body{padding:2px 0}
.analytics-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:.5px solid var(--bd)}
.analytics-row:last-child{border-bottom:none}
.analytics-row .k{font-size:12px;color:var(--tx2)}
.analytics-row .v{font-family:var(--font-m);font-size:12px;font-weight:500;color:var(--tx);letter-spacing:-.2px}
.query-row{display:flex;gap:6px;flex-wrap:wrap}
.query-btn{font-size:9.5px;font-weight:700;padding:7px 12px;border-radius:100px;background:var(--bg2);
  border:.5px solid var(--bd);color:var(--tx2);transition:all .15s;text-align:left;line-height:1.4}
.query-btn:active{background:var(--bg3)}
.result-card{background:var(--bg2);border:.5px solid var(--bd2);border-radius:12px;padding:13px;
  font-size:12px;color:var(--tx2);line-height:1.65;animation:fadeIn .2s ease}
.result-card strong{color:var(--gold);font-weight:700}
.result-card em{font-style:normal;font-family:var(--font-m);color:var(--tx);letter-spacing:-.2px}

/* Settings sheet */
#s-bg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
#s-sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  z-index:101;background:var(--bg2);border-radius:20px 20px 0 0;border-top:.5px solid var(--bd2);
  transition:transform .28s cubic-bezier(.32,0,.67,0);padding-bottom:var(--sab)}
#s-sheet.open{transform:translateX(-50%) translateY(0%)}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--bd2);margin:10px auto 0}
#s-inner{padding:0 1rem 1rem;max-height:75dvh;overflow-y:auto;scrollbar-width:none}
#s-inner::-webkit-scrollbar{display:none}
.set-sect{margin-top:1rem}
.set-sect-title{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin-bottom:10px}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;
  background:var(--bg3);border-radius:10px;margin-bottom:7px;font-size:13px;cursor:pointer;transition:opacity .12s}
.set-row:active{opacity:.6}
.set-row .l{color:var(--tx2);font-size:12px}
.set-row .r{font-family:var(--font-m);color:var(--tx3);font-size:10.5px}
.set-input-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.danger{color:var(--no)}
.set-save-btn{width:100%;padding:13px 0;background:var(--gold);color:var(--bg);font-weight:800;
  font-size:12px;letter-spacing:.07em;text-transform:uppercase;border-radius:var(--r);margin-top:2px;transition:opacity .12s}
.set-save-btn:active{opacity:.7}

.price-err{padding:7px 1rem;background:var(--nodim);font-size:10px;color:var(--no);
  font-family:var(--font-m);text-align:center;border-bottom:.5px solid rgba(224,79,79,.2)}
.foot{padding:1.5rem 1rem 1rem;font-size:10px;color:var(--tx3);line-height:2;text-align:center}
.foot .ws{color:var(--gold);font-weight:800;letter-spacing:.05em;display:block;margin-top:8px}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="hdr-row">
      <div class="wordmark">WEALTH<span class="sub" id="refresh-lbl"></span></div>
      <div class="hdr-right">
        <button id="btn-refresh" class="icon-btn" onclick="doRefresh()">

        </button>
        <button class="icon-btn ghost" onclick="openSettings()">
          <svg viewBox="0 0 24 24" style="width:15px;height:15px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>

    <div id="v-add" class="view"></div>

  </main>

  <div id="s-sheet" style="transform:translateX(-50%) translateY(100%)">
    <div class="sheet-handle"></div>
    <div id="s-inner"></div>
  </div>
</div>
<script>
/* ── Constants ──────────────────────────────────────────────────────────── */
const CATS = {
  IDX:    {name:'Indonesia IDX',   color:'#c2512b', cur:'IDR'},
  TW:     {name:'Taiwan Equities', color:'#0e7c55', cur:'TWD'},
  Crypto: {name:'Cryptocurrency',  color:'#d97706', cur:'USD'},
  Mutual: {name:'Mutual Funds',    color:'#6d28d9', cur:'IDR'},
  US:     {name:'US Stocks',       color:'#1d6fa5', cur:'USD'},
  BankTW: {name:'Banks · TWD',     color:'#0891b2', cur:'TWD'},
  BankID: {name:'Banks · IDR',     color:'#65a30d', cur:'IDR'},
};
const INCOME_CATS = [
  {key:'Salary',icon:'💼',label:'Salary / Wages'},{key:'Freelance',icon:'💻',label:'Freelance'},
  {key:'Dividend',icon:'📊',label:'Dividend / Interest'},{key:'Rental',icon:'🏘',label:'Rental income'},
  {key:'Gift',icon:'🎁',label:'Gift / Transfer'},{key:'Other',icon:'💰',label:'Other income'},
];
const EXPENSE_CATS = [
  {key:'Housing',icon:'🏠',label:'Housing / Rent'},{key:'Food',icon:'🍜',label:'Food & Dining'},
  {key:'Transport',icon:'🚇',label:'Transport'},{key:'Utilities',icon:'💡',label:'Utilities'},
  {key:'Health',icon:'🏥',label:'Health & Medical'},{key:'Education',icon:'📚',label:'Education'},
  {key:'Subs',icon:'📱',label:'Subscriptions'},{key:'Fees',icon:'💸',label:'Investment fees'},
  {key:'Shopping',icon:'🛍',label:'Shopping'},{key:'Other',icon:'📌',label:'Other expense'},
];
const CG_IDS = {
  BTC:'bitcoin',ETH:'ethereum',SOL:'solana',BNB:'binancecoin',SUI:'sui',
  BGB:'bitget-token',XRP:'ripple',ADA:'cardano',AVAX:'avalanche-2',
  LINK:'chainlink',MATIC:'matic-network',DOT:'polkadot',UNI:'uniswap',USDT:'tether',
};
const YF_IDX_SUFFIX = '.JK'; // IDX → BBCA.JK etc.
const TWSE_SYM_MAP  = {'2330':'tse_2330.tw','2885':'tse_2885.tw','3711':'tse_3711.tw',
  '00940':'tse_00940.tw','00981A':'otc_00981A.tw','2317':'tse_2317.tw',
  '2454':'tse_2454.tw','0050':'tse_0050.tw','0056':'tse_0056.tw'};
const BROKERS = ['Ajaib','SinoPac','Binance','Bitget','Gate.io','Other'];
const CURRS   = ['TWD','IDR','USD','USDT'];

/* ── State ──────────────────────────────────────────────────────────────── */
// assets: [{id,sym,name,cat,broker,cur,qty,avg,px,isBank}]
// trades: [{id,type,sym,name,broker,cur,qty,px,date}]
// flows:  [{id,type,category,icon,amount,cur,account,date,note,recurring}]
let S = {
  assets: [], trades: [], flows: [],
  fx: {USD_TWD:32.20, IDR_TWD:0.0020, TWD_TWD:1, USDT_TWD:32.18},
  goal: 1000000,
};
let livePrices   = {};
let refreshing   = false;
let lastRefresh  = null;
let curTab       = 'overview';
let allocMode    = 'class';
let holdFilter   = 'All';
let holdSort     = 'value';
let ledgerTab    = 'all';
let ledgerBroker = 'All';
let addMode      = 'trade';
let trType       = 'BUY';
let cfType       = 'INCOME';
let recurring    = false;

function load() {
  try { const d = localStorage.getItem('w:state'); if (d) S = {...S,...JSON.parse(d)}; } catch {}
}
function save() {
  try { localStorage.setItem('w:state', JSON.stringify(S)); } catch {}
}

/* ── Helpers ────────────────────────────────────────────────────────────── */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
function today() { return new Date().toISOString().slice(0,10); }
function curMon() { return new Date().toISOString().slice(0,7); }
function el(id) { return document.getElementById(id); }
function toNTD(amt, cur) {
  return amt * (S.fx[cur+'_TWD'] ?? 1);
}
function fnum(n, dp=2) {
  if (n==null||isNaN(n)) return '—';
  const sign=n<0?'−':'', a=Math.abs(n);
  if(a>=1e9) return sign+(a/1e9).toFixed(2)+'B';
  if(a>=1e6) return sign+(a/1e6).toFixed(2)+'M';
  if(a>=1e3) return sign+(a/1e3).toFixed(1)+'K';
  return sign+a.toFixed(dp);
}
const fnt = n => 'NT$'+fnum(n);
const sp = n => n>=0?'+':'';
const sc = n => n>=0?'var(--ok)':'var(--no)';
function assetVal(a) { return toNTD(a.isBank ? a.px : a.qty * livePx(a), a.cur); }
function assetCost(a){ return toNTD(a.qty * a.avg, a.cur); }
function livePx(a)   { return livePrices[a.sym] ?? a.px; }
function isLive(sym) { return sym in livePrices; }
function pnlPct(a)   { if(a.isBank||!a.avg) return null; const v=assetVal(a),c=assetCost(a); return c>0?(v-c)/c*100:null; }
function computeFlow(flows, mon) {
  const ent = flows.filter(f => f.date?.slice(0,7)===mon);
  const inc = ent.filter(f=>f.type==='INCOME').reduce((s,f)=>s+toNTD(f.amount,f.cur),0);
  const exp = ent.filter(f=>f.type==='EXPENSE').reduce((s,f)=>s+toNTD(f.amount,f.cur),0);
  return {inc, exp, net:inc-exp, rate:inc>0?(inc-exp)/inc*100:0, count:ent.length};
}
function projMonths(nw, monthly, target) {
  if(nw>=target) return 0;
  if(monthly<=0) return null;
  let n=nw, m=0;
  while(n<target && m<300) { n = n*1.003 + monthly; m++; }
  return m<300 ? m : null;
}

/* ── Price APIs ─────────────────────────────────────────────────────────── */
async function fetchAllPrices() {
  if(refreshing) return;
  refreshing = true;
  el('btn-refresh').classList.add('spinning');
  el('price-err').style.display = 'none';
  const errs = [];

  // 1. CoinGecko
  const cgSyms = [...new Set(S.assets.filter(a=>a.cat==='Crypto').map(a=>a.sym))];
  const cgIds = cgSyms.map(s=>CG_IDS[s]).filter(Boolean);
  if(cgIds.length) {
    try {
      const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids='+cgIds.join(',')+'&vs_currencies=usd',
        {signal:AbortSignal.timeout(8000)});
      if(r.ok) {
        const d = await r.json();
        Object.entries(CG_IDS).forEach(([sym,id])=>{ if(d[id]?.usd) livePrices[sym]=d[id].usd; });
      }
    } catch { errs.push('Crypto'); }
  }

  // 2. TWSE
  const twSyms = [...new Set(S.assets.filter(a=>a.cat==='TW').map(a=>a.sym))];
  const twseQ  = twSyms.map(s=>TWSE_SYM_MAP[s]).filter(Boolean);
  if(twseQ.length) {
    try {
      const r = await fetch('https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch='+encodeURIComponent(twseQ.join('|'))+'&json=1&delay=0',
        {signal:AbortSignal.timeout(8000)});
      if(r.ok) {
        const d = await r.json();
        (d.msgArray||[]).forEach(i=>{ const p=parseFloat(i.z!=='-'?i.z:i.y); if(i.c&&!isNaN(p)&&p>0) livePrices[i.c]=p; });
      }
    } catch { errs.push('TWSE'); }
  }

  // 3. Yahoo Finance (IDX + US)
  const yfAssets = S.assets.filter(a=>a.cat==='IDX'||a.cat==='US');
  await Promise.allSettled(yfAssets.map(async a => {
    try {
      const yfsym = a.cat==='IDX' ? a.sym+YF_IDX_SUFFIX : a.sym;
      const r = await fetch('https://query2.finance.yahoo.com/v8/finance/chart/'+yfsym+'?interval=1d&range=1d',
        {signal:AbortSignal.timeout(8000)});
      if(r.ok) {
        const d = await r.json();
        const p = d.chart?.result?.[0]?.meta?.regularMarketPrice;
        if(p&&p>0) livePrices[a.sym]=p;
      }
    } catch {}
  }));

  // 4. FX
  try {
    const r = await fetch('https://open.er-api.com/v6/latest/USD',{signal:AbortSignal.timeout(8000)});
    if(r.ok) {
      const d = await r.json();
      if(d.rates?.TWD&&d.rates?.IDR) {
        S.fx = {USD_TWD:d.rates.TWD, IDR_TWD:d.rates.TWD/d.rates.IDR, TWD_TWD:1, USDT_TWD:d.rates.TWD*0.9998};
        save();
      }
    }
  } catch { errs.push('FX'); }

  refreshing = false;
  lastRefresh = new Date();
  el('btn-refresh').classList.remove('spinning');
  if(errs.length) {
    el('price-err').textContent = 'Could not reach: '+errs.join(', ')+' — showing cached prices';
    el('price-err').style.display = '';
  }
  updateRefreshLabel();
  if(curTab==='overview') renderOverview();
  if(curTab==='holdings') renderHoldings();
}

function updateRefreshLabel() {
  if(!lastRefresh) { el('refresh-lbl').textContent=''; return; }
  const m = Math.round((Date.now()-lastRefresh)/60000);
  el('refresh-lbl').textContent = m<1?' · just now':' · '+m+'m ago';
}

async function doRefresh() {
  await fetchAllPrices();
}

/* ── Navigation ─────────────────────────────────────────────────────────── */
const NAV = [
  {k:'overview',l:'Overview',ic:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'},
  {k:'holdings',l:'Holdings',ic:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>'},
  {k:'add',l:'Add',ic:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'},
  {k:'ledger',l:'Ledger',ic:'<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>'},
  {k:'notes',l:'Notes',ic:'<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>'},
];
function renderNav() {
  el('nav').innerHTML = NAV.map(n=>`<button class="nbt ${curTab===n.k?'on':''}" onclick="switchTab('${n.k}')"><svg viewBox="0 0 24 24">${n.ic}</svg>${n.l}</button>`).join('');
}
function switchTab(tab) {
  curTab = tab;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  el('v-'+tab).classList.add('on');
  renderNav();
  if(tab==='overview') renderOverview();
  else if(tab==='holdings') renderHoldings();
  else if(tab==='add') renderAdd();
  else if(tab==='ledger') renderLedger();
  else if(tab==='notes') renderNotes();
}

/* ── Overview ───────────────────────────────────────────────────────────── */
function renderOverview() {
  const inv = S.assets.filter(a=>!a.isBank);
  const banks = S.assets.filter(a=>a.isBank);
  const invVal  = inv.reduce((s,a)=>s+assetVal(a),0);
  const invCost = inv.reduce((s,a)=>s+assetCost(a),0);
  const cashVal = banks.reduce((s,a)=>s+assetVal(a),0);
  const nw = invVal + cashVal;
  const pnl = invVal - invCost;
  const pnlPct = invCost>0 ? pnl/invCost*100 : 0;
  const flow = computeFlow(S.flows, curMon());
  const goalPct = S.goal>0 ? Math.min(nw/S.goal*100,100) : 0;
  const months  = projMonths(nw, flow.net, S.goal);

  // Allocation
  const tot = nw||1;
  const alloc = {};
  const addAlloc = (key,name,color,v) => { if(!alloc[key]) alloc[key]={key,name,color,v:0}; alloc[key].v+=v; };
  S.assets.forEach(a => {
    const v = assetVal(a), c = CATS[a.cat];
    if(allocMode==='class')    addAlloc(a.cat,c.name,c.color,v);
    if(allocMode==='broker')   addAlloc(a.broker,a.broker,c.color,v);
    if(allocMode==='currency') addAlloc(a.cur,a.cur,c.color,v);
  });
  const rows = Object.values(alloc).sort((a,b)=>b.v-a.v);
  rows.forEach(r=>r.pct=r.v/tot*100);

  const BPAL = {Ajaib:'#c2512b',SinoPac:'#0e7c55',Binance:'#d97706',Bitget:'#6d28d9','Gate.io':'#0891b2'};
  if(allocMode==='broker') rows.forEach(r=>{ if(BPAL[r.key]) r.color=BPAL[r.key]; });

  el('v-overview').innerHTML = `
  <div class="hero">
    <div class="eyebrow" style="margin-bottom:8px">Net Worth · NTD</div>
    <div class="nw-big">${fnt(nw)}</div>
    <div class="hero-row">
      <span class="hero-sub">Invested <strong>${fnt(invVal)}</strong></span>
      <span style="color:var(--tx3)">·</span>
      <span class="hero-sub">P&L <strong style="color:${sc(pnl)}">${sp(pnl)}${fnt(Math.abs(pnl))}</strong></span>
      <span class="pill ${pnlPct>=0?'pos':'neg'}">${sp(pnlPct)}${pnlPct.toFixed(1)}%</span>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat"><div class="stat-l">Invested</div><div class="stat-v">${fnt(invCost)}</div></div>
    <div class="stat"><div class="stat-l">Cash</div><div class="stat-v">${fnt(cashVal)}</div></div>
    <div class="stat"><div class="stat-l">Positions</div><div class="stat-v">${inv.length}</div></div>
  </div>

  ${flow.count>0 ? `
  <div class="flow-sec">
    <div class="flow-hd"><div class="eyebrow dot" style="--gold:#c9a870">Monthly · ${curMon()}</div></div>
    <div class="flow-grid">
      <div class="flow-cell"><div class="l">Income</div><div class="v pos">${fnt(flow.inc)}</div></div>
      <div class="flow-cell"><div class="l">Expenses</div><div class="v neg">${fnt(flow.exp)}</div></div>
      <div class="flow-cell"><div class="l">Net</div><div class="v ${flow.net>=0?'pos':'neg'}">${sp(flow.net)}${fnt(Math.abs(flow.net))}</div></div>
    </div>
    <div class="flow-bar-row">
      <span class="flow-bar-lbl">Savings rate</span>
      <div class="flow-track"><div class="flow-fill" style="width:${Math.max(0,Math.min(100,flow.rate)).toFixed(0)}%"></div></div>
      <span class="flow-rate">${flow.rate.toFixed(0)}%</span>
    </div>
  </div>` : ''}

  ${S.goal>0 ? `
  <div class="goal-bar">
    <div class="goal-hd">
      <span class="goal-lbl">Goal · NTD</span>
      <span class="goal-val"><strong>${fnt(nw)}</strong> / ${fnt(S.goal)} · ${goalPct.toFixed(1)}%</span>
    </div>
    <div class="goal-track"><div class="goal-fill" style="width:${goalPct.toFixed(1)}%"></div></div>
    ${months!=null ? `<div class="goal-proj">At ${fnt(flow.net)}/mo savings → reach goal in <strong>~${months} months</strong></div>` : ''}
  </div>` : ''}

  ${rows.length ? `
  <div class="alloc-sec">
    <div class="alloc-hd">
      <div class="eyebrow">Allocation</div>
      <div class="alloc-toggle">
        <button class="${allocMode==='class'?'on':''}" onclick="setAllocMode('class')">class</button>
        <button class="${allocMode==='broker'?'on':''}" onclick="setAllocMode('broker')">broker</button>
        <button class="${allocMode==='currency'?'on':''}" onclick="setAllocMode('currency')">currency</button>
      </div>
    </div>
    <div class="alloc-bar">${rows.map(r=>`<div class="alloc-seg" style="width:${r.pct.toFixed(2)}%;background:${r.color}" title="${r.name}"></div>`).join('')}</div>
    <div class="alloc-rows">${rows.map(r=>`<div class="ar"><div class="ar-dot" style="background:${r.color}"></div><span class="ar-name">${r.name}</span><span class="ar-amt">${fnt(r.v)}</span><span class="ar-pct">${r.pct.toFixed(0)}%</span></div>`).join('')}</div>
  </div>` : ''}

  <div class="fx-row">
    <div class="fx"><strong>USD</strong><span>${S.fx.USD_TWD.toFixed(2)}</span></div>
    <div class="fx"><strong>IDR</strong><span>${S.fx.IDR_TWD.toFixed(5)}</span></div>
    <div class="fx"><strong>USDT</strong><span>${S.fx.USDT_TWD.toFixed(2)}</span></div>
    <div class="fx"><strong>→</strong><span>NTD</span></div>
  </div>

  ${!S.assets.length ? `<div class="empty">No assets yet<br>Go to <strong>Add</strong> to record your first position<br>or open <strong>Settings</strong> to load sample data</div>` : ''}
  <div class="foot">
    Net worth = bank balances → NTD · <strong>authoritative</strong><br>
    Investments = mark-to-market · <strong>informational</strong><br>
    All data stored on this device · no account needed
    <span class="ws">WEALTH</span>
  </div>`;
}
function setAllocMode(m) { allocMode=m; renderOverview(); }

/* ── Holdings ───────────────────────────────────────────────────────────── */
function renderHoldings() {
  const cats = ['All',...Object.keys(CATS)];
  const filtered = S.assets.filter(a => holdFilter==='All'||a.cat===holdFilter);
  const sorted = [...filtered].sort((a,b)=>{
    if(holdSort==='value') return assetVal(b)-assetVal(a);
    if(holdSort==='pnl') { const pa=pnlPct(a)??-999, pb=pnlPct(b)??-999; return pb-pa; }
    return (a.sym||a.name).localeCompare(b.sym||b.name);
  });
  const totalVal = sorted.reduce((s,a)=>s+assetVal(a),0);
  const liveCount = sorted.filter(a=>isLive(a.sym)).length;

  let grouped = '';
  const seen = new Set();
  sorted.forEach(a => {
    const cat = CATS[a.cat];
    const grpKey = holdSort==='value' ? a.cat : '_';
    if(!seen.has(grpKey)) {
      seen.add(grpKey);
      if(holdSort==='value') {
        const grpVal = sorted.filter(x=>x.cat===a.cat).reduce((s,x)=>s+assetVal(x),0);
        grouped += `<div class="sec-hdr"><span>${cat?.name||a.cat}</span><span class="sec-hdr-r">${fnt(grpVal)}</span></div>`;
      }
    }
    const pp = pnlPct(a);
    const lp = livePx(a);
    const qDisp = a.isBank ? '' : (a.qty<1?a.qty.toFixed(4):a.qty>=1000?fnum(a.qty,0):a.qty.toLocaleString('en-US',{maximumFractionDigits:2}));
    grouped += `<div class="hrow" onclick="openAssetDetail('${a.id}')">
      <div class="hrow-bar" style="background:${cat?.color||'#888'}"></div>
      <div class="hrow-ico" style="background:color-mix(in oklab,${cat?.color||'#888'} 14%,#111116);color:${cat?.color||'#888'}">${(a.sym||a.name).slice(0,4).toUpperCase()}</div>
      <div class="hrow-mid">
        <div class="hrow-name">${a.sym||a.name}<span style="color:var(--tx3);font-family:var(--font-d);font-size:10px;font-weight:400;margin-left:4px">· ${a.broker}</span></div>
        <div class="hrow-sub">${a.name}${!a.isBank&&qDisp?' · '+qDisp+' × '+a.cur:' · '+a.cur}</div>
        ${!a.isBank ? `<div class="hrow-px">${lp.toLocaleString('en-US',{maximumFractionDigits:2})} ${a.cur}<span class="${isLive(a.sym)?'live-dot':'stale-dot'}"></span></div>` : ''}
      </div>
      <div class="hrow-right">
        <div class="hrow-val">${fnt(assetVal(a))}</div>
        ${pp!=null?`<div class="hrow-pnl" style="color:${sc(pp)}">${sp(pp)}${pp.toFixed(1)}%</div>`:''}
      </div>
      <div class="hrow-chev"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
    </div>`;
  });

  el('v-holdings').innerHTML = `

function autoFill() {
  const sym = (el('f-sym')?.value||'').toUpperCase();
  const a = S.assets.find(x=>x.sym===sym);
  if(a) {
    if(el('f-name')) el('f-name').value=a.name;
    if(el('f-broker')) el('f-broker').value=a.broker;
    if(el('f-cat')) el('f-cat').value=a.cat;
    if(el('f-cur')) el('f-cur').value=a.cur;
    if(el('f-px')) el('f-px').value=a.px;
    if(el('f-avg')) el('f-avg').value=a.avg;
  }
}

function saveTrade() {
  const sym = el('f-sym')?.value.trim().toUpperCase();
  const name = el('f-name')?.value.trim();
  const qty  = parseFloat(el('f-qty')?.value||0);
  const avg  = parseFloat(el('f-avg')?.value||0);
  const px   = parseFloat(el('f-px')?.value||0);
  const cur  = el('f-cur')?.value || 'IDR';
  const cat  = el('f-cat')?.value || 'IDX';
  const broker = el('f-broker')?.value || 'Ajaib';
  const date = el('f-date')?.value || today();
  if(!sym) { el('f-sym')?.focus(); return; }

  // Update or add holding
  const isBank = cat==='BankTW'||cat==='BankID';
  if(trType==='BUY'||trType==='SYNC') {
    const existing = S.assets.find(a=>a.sym===sym&&a.broker===broker);
    if(existing) {
      if(trType==='BUY'&&qty>0&&avg>0) {
        const newQty = existing.qty+qty;
        existing.avg = (existing.avg*existing.qty + avg*qty)/newQty;
        existing.qty = newQty;
      }
      if(px>0) existing.px=px;
    } else {
      S.assets.push({id:uid(),sym,name:name||sym,cat,broker,cur,qty:qty||1,avg:avg||0,px:px||0,isBank});
    }
  }

  S.trades.push({id:uid(),type:trType,sym,name:name||sym,broker,cur,qty,px,date});
  save();

  const done = el('trade-done');
  if(done) { done.innerHTML='<div style="text-align:center"><span class="success-pill">✓ Added to ledger</span></div>'; setTimeout(()=>{if(done)done.innerHTML='';},2200); }
  if(el('f-qty')) el('f-qty').value='';
  if(el('f-px'))  el('f-px').value='';
  if(el('f-sym')) el('f-sym').value='';
  if(el('f-name'))el('f-name').value='';
}

function saveFlow() {
  const amt  = parseFloat(el('cf-amt')?.value||0);
  const cur  = el('cf-cur')?.value||'TWD';
  const cat  = el('cf-cat')?.value||'Salary';
  const acct = el('cf-acct')?.value||'SinoPac';
  const note = el('cf-note')?.value.trim()||'';
  const date = el('cf-date')?.value||today();
  if(!amt||amt<=0) { el('cf-amt')?.focus(); return; }
  const allCats = [...INCOME_CATS,...EXPENSE_CATS];
  const catObj  = allCats.find(c=>c.key===cat)||{};
  S.flows.push({id:uid(),type:cfType,category:cat,icon:catObj.icon||'',amount:amt,cur,account:acct,date,note,recurring});
  save();
  const done = el('flow-done');
  if(done) { done.innerHTML='<div style="text-align:center"><span class="success-pill">✓ Cash flow recorded</span></div>'; setTimeout(()=>{if(done)done.innerHTML='';},2200); }
  if(el('cf-amt')) el('cf-amt').value='';
  if(el('cf-note'))el('cf-note').value='';
}
function clearTradeForm() { ['f-sym','f-name','f-qty','f-avg','f-px'].forEach(id=>{ if(el(id)) el(id).value=''; }); if(el('f-date')) el('f-date').value=today(); }

/* ── Ledger ─────────────────────────────────────────────────────────────── */
function renderLedger() {
  const allTrades = [...S.trades].sort((a,b)=>b.date>a.date?1:-1);
  const allFlows  = [...S.flows].sort((a,b)=>b.date>a.date?1:-1);
  const all = [...allTrades.map(t=>({...t,_k:'trade'})),...allFlows.map(f=>({...f,_k:'flow'}))].sort((a,b)=>b.date>a.date?1:-1);

  const filtered = all.filter(e=>{
    if(ledgerTab==='trades'  && e._k!=='trade')  return false;
    if(ledgerTab==='income'  && e.type!=='INCOME')  return false;
    if(ledgerTab==='expense' && e.type!=='EXPENSE') return false;
    if((ledgerTab==='all'||ledgerTab==='trades') && ledgerBroker!=='All' && e.broker && e.broker!==ledgerBroker) return false;
    return true;
  });

  const flow = computeFlow(S.flows, curMon());

  el('v-ledger').innerHTML = `
  <div class="tab-hd" style="display:flex;align-items:flex-end;justify-content:space-between">
    <div><div class="ttl">Ledger</div><div class="sub">Trades · income · expenses · ${all.length} entries</div></div>
    <button class="icon-btn" style="background:var(--gold);color:var(--bg);border-color:var(--gold)" onclick="switchTab('add')">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>

  ${flow.count>0 ? `
  <div style="padding:10px 1rem;background:var(--bg1);border-bottom:.5px solid var(--bd);display:flex;align-items:center;justify-content:space-between">
    <div>
      <div style="font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin-bottom:4px">${curMon()}</div>
      <div style="font-family:var(--font-m);font-size:11px;color:var(--tx2)">
        <span style="color:var(--ok)">${fnt(flow.inc)}</span>
        <span style="color:var(--tx3);margin:0 5px">in</span>
        <span style="color:var(--no)">${fnt(flow.exp)}</span>
        <span style="color:var(--tx3);margin:0 5px">out</span>
        <span style="color:${sc(flow.net)};font-weight:500">${sp(flow.net)}${fnt(Math.abs(flow.net))} net</span>
      </div>
    </div>
    <div style="text-align:right">
      <div style="font-family:var(--font-m);font-size:13px;font-weight:500;color:${flow.rate>=50?'var(--ok)':'var(--tx2)'}">${flow.rate.toFixed(0)}%</div>
      <div style="font-size:8.5px;color:var(--tx3)">saved</div>
    </div>
  </div>` : ''}

  <div class="sec-hdr"><span>Journal</span><span class="sec-hdr-r">${filtered.length} shown</span></div>
  <div class="chips-row">
    ${[['all','All'],['trades','Trades'],['income','Income'],['expense','Expenses']].map(([k,l])=>`<button class="chip ${ledgerTab===k?'on':''}" onclick="setLedgerTab('${k}')">${l}</button>`).join('')}
  </div>
  ${(ledgerTab==='all'||ledgerTab==='trades')?`<div class="chips-row">${['All',...BROKERS].map(b=>`<button class="chip ${ledgerBroker===b?'on':''}" onclick="setLedgerBroker('${b}')">${b}</button>`).join('')}</div>`:''}

  ${filtered.length ? filtered.map(e=>{
    if(e._k==='flow') {
      const amtNT = toNTD(e.amount, e.cur);
      return `<div class="tx-row">
        <div class="tx-tag ${e.type==='INCOME'?'INCOME':'EXPENSE'}">${e.type==='INCOME'?'IN':'OUT'}</div>
        <div class="tx-mid">
          <div class="tx-sym">${e.icon} ${e.category}<span style="color:var(--tx3);font-family:var(--font-d);font-size:10px;font-weight:400;margin-left:3px">· ${e.account}</span></div>
          <div class="tx-sub">${e.note||'—'}${e.recurring?'<span style="color:var(--gold);margin-left:5px;font-size:9px;font-weight:800">↻</span>':''}</div>
        </div>
        <div class="tx-right">
          <div class="tx-amt ${e.type==='INCOME'?'pos':'neg'}">${e.type==='INCOME'?'+':'−'}${fnt(amtNT)}</div>
          <div class="tx-date">${e.date}</div>

    }
    const ttl = toNTD((e.qty||0)*(e.px||0), e.cur);
    return `<div class="tx-row">
      <div class="tx-tag ${e.type}">${e.type==='DIVIDEND'?'DIV':e.type}</div>

/* ── Notes / Analytics ──────────────────────────────────────────────────── */
function renderNotes() {
  const inv   = S.assets.filter(a=>!a.isBank);
  const banks = S.assets.filter(a=>a.isBank);
  const nw    = inv.reduce((s,a)=>s+assetVal(a),0)+banks.reduce((s,a)=>s+assetVal(a),0);
  const cost  = inv.reduce((s,a)=>s+assetCost(a),0);
  const pnl   = inv.reduce((s,a)=>s+(assetVal(a)-assetCost(a)),0);
  const flow  = computeFlow(S.flows, curMon());
  const hhi   = inv.reduce((s,a)=>{const w=assetVal(a)/(nw||1);return s+w*w;},0);
  const divScore = Math.max(0,(1-hhi)*100);

  el('v-notes').innerHTML = `

      </div>
    </div>

      <div class="card-hd">Cash Flow · ${curMon()}</div>

        ${[['Income',fnt(flow.inc),'var(--ok)'],['Expenses',fnt(flow.exp),'var(--no)'],['Net saved',sp(flow.net)+fnt(Math.abs(flow.net)),sc(flow.net)],['Savings rate',flow.rate.toFixed(0)+'%',flow.rate>=50?'var(--ok)':null]].map(([k,v,c])=>`

function runQuery(q) {
  const inv   = S.assets.filter(a=>!a.isBank);
  const nw    = S.assets.reduce((s,a)=>s+assetVal(a),0);
  let html = '';

  if(q==='topgainers'||q==='toplosers') {
    const sorted = inv.filter(a=>a.avg>0).map(a=>({a,pp:pnlPct(a)})).filter(x=>x.pp!=null).sort((a,b)=>q==='topgainers'?b.pp-a.pp:a.pp-b.pp).slice(0,5);
    if(!sorted.length) { html='<span>No positions with avg cost set.</span>'; }
    else html=sorted.map(({a,pp})=>`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:.5px solid var(--bd)"><em>${a.sym}</em><strong style="color:${sc(pp)}">${sp(pp)}${pp.toFixed(1)}%</strong></div>`).join('');
  }
  if(q==='currency') {
    const expo={};
    S.assets.forEach(a=>{expo[a.cur]=(expo[a.cur]||0)+assetVal(a);});
    const tot=Object.values(expo).reduce((s,v)=>s+v,0)||1;
    html=Object.entries(expo).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:.5px solid var(--bd)"><em>${k}</em><strong>${fnt(v)} <span style="color:var(--tx3)">${(v/tot*100).toFixed(0)}%</span></strong></div>`).join('');
  }
  if(q==='broker') {
    const acc={};
    S.assets.forEach(a=>{acc[a.broker]=(acc[a.broker]||0)+assetVal(a);});
    const tot=Object.values(acc).reduce((s,v)=>s+v,0)||1;
    html=Object.entries(acc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:.5px solid var(--bd)"><em>${k}</em><strong>${fnt(v)} <span style="color:var(--tx3)">${(v/tot*100).toFixed(0)}%</span></strong></div>`).join('');
  }
  if(q==='goal') {
    const flow=computeFlow(S.flows,curMon());
    const pct=S.goal>0?Math.min(nw/S.goal*100,100):0;
    const months=S.goal>0&&flow.net>0?projMonths(nw,flow.net,S.goal):null;
    html=`<div style="padding:4px 0"><strong>Goal: ${fnt(S.goal)}</strong></div>
    <div style="padding:4px 0;border-top:.5px solid var(--bd)">Current: <em>${fnt(nw)}</em> — <strong>${pct.toFixed(1)}%</strong> there</div>
    <div style="padding:4px 0;border-top:.5px solid var(--bd)">Gap: <em>${fnt(Math.max(0,S.goal-nw))}</em></div>
    ${months!=null?`<div style="padding:4px 0;border-top:.5px solid var(--bd)">At ${fnt(flow.net)}/mo → <strong style="color:var(--gold)">~${months} months</strong></div>`:'<div style="padding:4px 0;border-top:.5px solid var(--bd);color:var(--tx3)">Add income/expense to get projection</div>'}`;
  }
  const res = el('query-result');
  if(res) res.innerHTML = `<div class="result-card">${html}</div>`;
}

}
function closeSettings() {
  el('s-sheet').classList.remove('open');
  el('s-bg').style.display='none';
  el('s-inner').innerHTML='';
}
function saveSettings() {
  const u=parseFloat(el('s-usd')?.value), i=parseFloat(el('s-idr')?.value),
        t=parseFloat(el('s-usdt')?.value), g=parseFloat(el('s-goal')?.value);
  if(u>0) S.fx.USD_TWD=u; if(i>0) S.fx.IDR_TWD=i; if(t>0) S.fx.USDT_TWD=t;
  if(g>=0) S.goal=g;
  save(); closeSettings();
  if(curTab==='overview') renderOverview();
}
function exportCSV() {
  const rows = [['Sym','Name','Cat','Broker','Qty','AvgCost','Price','Cur','ValNTD','PnlPct']];
  S.assets.filter(a=>a.isBank===false).forEach(a=>{
    const pp=pnlPct(a);
    rows.push([a.sym,a.name,a.cat,a.broker,a.qty,a.avg,a.px,a.cur,Math.round(assetVal(a)),pp!=null?pp.toFixed(2):'']);
  });
  const csv = rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const link = document.createElement('a');
  link.href = 'data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  link.download = 'wealth_'+today()+'.csv';
  link.click();
  closeSettings();
}
